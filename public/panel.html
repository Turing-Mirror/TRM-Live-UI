<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直播控制面板</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
  <header class="header">
    <h1 class="header-title">直播控制面板</h1>
    <span class="header-status" id="status"></span>
    <button class="button" type="submit" form="form" title="Ctrl + Enter">更新到直播</button>
  </header>
  <main class="main">
    <section class="card">
      <h2 class="card-title">状态</h2>
      <div class="scene-row" id="scene-list"></div>
    </section>
    <section class="card presets">
      <h2 class="card-title">预设</h2>
      <div class="presets-row">
        <select class="input" id="preset-list"></select>
        <button class="button button-plain" type="button" id="preset-load">载入</button>
        <button class="button button-plain" type="button" id="preset-remove">删除</button>
      </div>
      <div class="presets-row">
        <input class="input" type="text" id="preset-name" placeholder="预设名称">
        <button class="button button-plain" type="button" id="preset-save">保存当前内容</button>
      </div>
    </section>
    <form id="form"></form>
  </main>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
