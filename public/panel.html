<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRM Live UI</title>
  <link rel="stylesheet" href="/panel/panel.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="appbar">
      <div class="appbar-brand">
        <span class="brand-name">TRM Live UI</span>
        <span id="sidebar-toggle"></span>
      </div>
      <div class="appbar-fill"></div>
      <span class="appbar-status" id="connection"></span>
    </header>
    <div class="body">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-main" id="sidebar-main"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </nav>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="notices" id="notices" aria-live="polite"></div>
  <script type="module" src="/panel/panel.js"></script>
</body>
</html>
